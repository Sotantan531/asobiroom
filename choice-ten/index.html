<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>二択ラッシュ | asobiroom テスト版</title>
<style>
*{box-sizing:border-box}html{color-scheme:light}body{margin:0;min-height:100dvh;background:#fbf5e6;color:#211c1d;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif;background-image:radial-gradient(#e8d5c7 1px,transparent 1px);background-size:17px 17px}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #1749d6;outline-offset:2px}button:disabled{cursor:default}main{width:min(1120px,97vw);margin:auto;padding:12px 0 20px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}header b{font-size:clamp(13px,2.5vw,22px)}header small{font-weight:800;color:#805850}header button,.minor{border:1px solid #9d7772;background:#fff4df;color:#673a45;border-radius:6px;font-weight:800;padding:6px 12px}.board{background:#fff9e7;padding:5px;border:2px solid #b79d76;box-shadow:0 4px 0 #d4bea2}.stage{display:grid;grid-template-columns:minmax(0,2.08fr) minmax(0,1fr);gap:5px}.left,.right{min-width:0;display:flex;flex-direction:column;gap:5px}.theme{background:#242021;color:white;border-radius:5px;padding:8px 12px;font-weight:900;font-size:clamp(12px,2.1vw,23px);line-height:1.3}.question{background:white;border:3px solid #c5a85c;display:flex;align-items:center;gap:12px;min-height:clamp(52px,9vw,100px);padding:8px 12px}.number,.circle{display:grid;place-items:center;border:.09em solid #161616;border-radius:50%;background:#fff;color:#111;font-weight:950;line-height:1;aspect-ratio:1;flex:none}.number{font-size:clamp(22px,5vw,54px);width:1.35em}.question h2{flex:1;text-align:center;margin:0;font-size:clamp(18px,3.7vw,41px);line-height:1.26;overflow-wrap:anywhere}.options{display:grid;grid-template-columns:1fr 1fr;flex:1;min-height:clamp(140px,27vw,310px);border:3px solid #c5a85c;background:#fff8b8}.option{display:grid;place-items:center;position:relative;min-width:0;padding:28px 8px 12px;text-align:center}.option+.option{border-left:3px solid #262225}.letter{position:absolute;top:0;left:0;background:#201d1e;color:#fff;font-size:clamp(16px,3.3vw,34px);font-weight:950;line-height:1;padding:4px 9px}.option strong{font-size:clamp(17px,4.2vw,46px);line-height:1.2;overflow-wrap:anywhere}.option.good{background:#dfff9c}.option.bad{background:#ffd2cf}.timerbox{padding:6px 6px 6px 10px;background:#fff;border:2px solid #b79d76}.clock{position:relative;display:flex;align-items:center;height:clamp(28px,4.5vw,45px);border:3px ridge #aaa49c;border-radius:8px;background:#211d1e}.clock i{position:absolute;z-index:2;left:-6px;border-radius:50%;border:2px solid #50484a;background:radial-gradient(circle at 35% 30%,#ffb2b0,#bf1937 45%,#7b1024);height:100%;aspect-ratio:1.1;box-shadow:1px 1px 2px #0007}.meter{position:absolute;inset:2px 2px 2px 18px;background:repeating-linear-gradient(90deg,transparent 0 6px,#513d4680 6px 8px),linear-gradient(0deg,#0003,transparent 45%,#fff9 54%,transparent 80%),linear-gradient(90deg,#da452a,#ffc143 51%,#82c53c 78%,#3192d6);overflow:hidden}.meter div{background:#201a23db;position:absolute;right:0;inset-block:0;width:0}.clock span{margin-left:auto;position:relative;padding:0 7px;color:white;font-size:clamp(10px,1.5vw,16px);font-weight:900;text-shadow:1px 1px 3px #161118,-1px -1px 2px #201b20}.clock b{font:950 clamp(17px,3vw,34px) monospace}.urgent .clock{outline:2px solid #d52f39}.remaining{background:linear-gradient(#82d847,#47ac24);border:2px solid #2f8621;text-align:center;padding:9px 2px;color:white;font-size:clamp(15px,3vw,32px);font-weight:950;text-shadow:0 1px 2px #276820}.remaining b{font-size:1.25em}.answerbox{flex:1;display:grid;grid-template-rows:1fr 1fr;gap:7px;background:#243c87;border:3px solid #749adf;padding:9px;min-height:0}.answer{min-height:48px;background:linear-gradient(#435fe0,#2439a7);border:2px solid #a1b4ff;color:white;box-shadow:inset 0 1px 0 #ffffff55,0 3px 0 #17267a;border-radius:6px;font-weight:950;font-size:clamp(30px,7vw,76px);line-height:1;transition:filter .12s}.answer:enabled:active{transform:translateY(2px);box-shadow:none}.answer:disabled{opacity:.55}.answer.good{background:#39a644}.answer.bad{background:#bc303c}.difficulty{display:flex;justify-content:space-between;background:linear-gradient(90deg,#c5bce8,#f2c0c8);color:#49358c;padding:4px 7px;margin-top:5px;font-size:clamp(10px,1.8vw,18px);font-weight:950}.difficulty span:last-child{color:#a22948}.nav{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;background:#a8a48c;padding:3px}.tile{display:grid;place-items:center;position:relative;background:linear-gradient(#95ff6c,#56d82c);border:2px solid #ecffb7;min-width:0;min-height:clamp(42px,8vw,92px);padding:2px;transition:background .15s,filter .25s}.tile.selected{background:#fff;border-color:#d1cdb2}.circle{font-size:clamp(12px,4vw,48px);width:1.45em}.tile.clear{background:#a4a4a4;border-color:#aaa;filter:brightness(.74)}.tile.clear .circle{display:none}.clear-label{font-size:clamp(8px,2.05vw,23px);font-weight:1000;color:#a60013;white-space:nowrap;text-shadow:0 1px #ffadb1}.tile.flash{background:#fff;filter:none;animation:pop .32s ease-out}.tile.flash .clear-label{color:#e00015}.tile.review{outline:2px solid #2539a8;outline-offset:-2px}.status{min-height:1.7em;text-align:center;font-size:clamp(12px,2vw,18px);font-weight:850;margin:7px 0 0}.status.ok{color:#b80018}.status.no{color:#b80018}.controls{display:flex;justify-content:center;gap:9px;margin:9px 0}.screen{position:relative}.overlay{position:absolute;inset:0;background:#272132b8;display:grid;place-items:center;padding:10px;z-index:5}.overlay[hidden]{display:none}.dialog{width:min(475px,94%);max-height:100%;overflow:auto;background:#fff8dd;border:3px solid #b89148;box-shadow:0 5px 0 #7a5c38;text-align:center;padding:clamp(10px,3vw,24px);border-radius:12px}.dialog h1{font-size:clamp(24px,5vw,49px);line-height:1.12;margin:0 0 8px;color:#253c88}.dialog p{font-size:clamp(11px,2vw,16px);margin:6px 0 12px}.dialog .action{background:#45b824;color:white;border:2px solid #297d14;border-radius:7px;font-weight:950;padding:10px 23px;font-size:clamp(14px,2.3vw,21px)}.dialog select{max-width:100%;font:inherit;padding:8px;background:#fff;border:1px solid #a2916a;border-radius:5px;margin:0 0 10px}.dialog .result-title{color:#bf152c}.foot{text-align:center;font-size:11px;color:#805850}@keyframes pop{from{transform:scale(.87)}to{transform:scale(1)}}@media(max-width:480px){main{padding-top:7px}.stage{gap:3px}.left,.right{gap:3px}.question{gap:5px;padding:5px}.theme{padding:5px}.answerbox{gap:4px;padding:5px}.timerbox{padding:4px 3px 4px 6px}.remaining{padding:5px 0}.nav{gap:1px;padding:2px}.tile{border-width:1px}.option+.option{border-left-width:2px}.option{padding:19px 4px 5px}.letter{padding:3px 5px}.clear-label{writing-mode:vertical-rl;letter-spacing:0}.dialog{padding:9px}.dialog p{margin:4px 0 7px}}@media(max-height:510px) and (orientation:landscape){main{width:min(970px,97vw);padding:3px 0}header{margin-bottom:3px}.theme{padding:3px 8px}.question{min-height:48px;padding:3px 10px}.question h2{font-size:clamp(18px,3vw,31px)}.number{font-size:30px}.options{min-height:120px}.option strong{font-size:clamp(20px,3.7vw,38px)}.timerbox{padding:3px 5px 3px 9px}.clock{height:29px}.remaining{padding:2px;font-size:19px}.answerbox{padding:4px;gap:4px}.answer{font-size:39px;min-height:37px}.tile{min-height:48px}.circle{font-size:29px}.difficulty{padding:2px 6px}.status{margin:3px 0 0}.controls{margin:3px 0}.foot{display:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main><header><b>asobiroom / 二択ラッシュ <small>TEST</small></b><button id="sound" aria-pressed="true">♫ ON</button></header><div class="screen"><section class="board" aria-label="クイズ"><div class="stage"><div class="left"><div class="theme" id="theme">テーマ</div><div class="question"><span id="num" class="number">1</span><h2 id="question">問題</h2></div><div class="options"><div class="option" id="oa"><span class="letter">A</span><strong id="a">—</strong></div><div class="option" id="ob"><span class="letter">B</span><strong id="b">—</strong></div></div></div><aside class="right"><div class="timerbox" id="timer"><div class="clock" role="timer"><i></i><div class="meter"><div id="shade"></div></div><span>残り <b id="time">120</b> 秒</span></div></div><div class="remaining">残り <b id="remaining">10</b> 問</div><div class="answerbox"><button class="answer" id="answerA" aria-label="Aを選ぶ">A</button><button class="answer" id="answerB" aria-label="Bを選ぶ">B</button></div></aside></div><div class="difficulty"><span>◀ 易しい</span><span>難しい ▶</span></div><nav id="nav" class="nav" aria-label="問題選択"></nav></section><div class="overlay" id="overlay"><div class="dialog" id="dialog"><h1>二択ラッシュ</h1><p>120秒で10問クリア！<br>下の番号を選んで、A・Bのどちらかを回答。<br>難しい問題は後回しでもOK。</p><select id="themeSelect" aria-label="テーマ"><option value="-1">おまかせ</option><option value="0">動物の雑学</option><option value="1">世界の雑学</option><option value="2">身近な科学</option></select><br><button class="action" id="start">スタート</button></div></div></div><p class="status" id="status" aria-live="polite">問題番号は自由に切り替えられます。</p><div class="controls"><button class="minor" id="menu">タイトルへ</button><button class="minor" id="retry">もう一度</button></div><div class="foot">開発テスト版・記録やランキングは送信されません</div></main><script src="../asobi-bgm.js?v=20261127guides"></script><script>
const sets=[
{theme:'動物の雑学：正しいのはどっち？',qs:[
['パンダの主食は？','竹','肉',0],['イルカは何の仲間？','魚類','哺乳類',1],['ダチョウは飛べる？','飛べない','飛べる',0],['タコの腕の本数は？','10本','8本',1],['コウモリは？','鳥類','哺乳類',1],['キリンの首の骨の数は？','7個','14個',0],['ペンギンが野生で生息するのは？','北極圏','赤道付近の島',1],['タコの心臓はいくつ？','3つ','2つ',0],['カモノハシは？','卵を産む','胎生で出産する',0],['ウォンバットのふんの形は？','球形','立方体に近い',1]]},
{theme:'世界の雑学：正しいのはどっち？',qs:[
['エッフェル塔がある国は？','フランス','イタリア',0],['ピラミッドで有名な国は？','ギリシャ','エジプト',1],['面積が広いのは？','カナダ','日本',0],['オーストラリアの首都は？','シドニー','キャンベラ',1],['赤道が通る国は？','ブラジル','スペイン',0],['マチュ・ピチュがある国は？','チリ','ペルー',1],['スエズ運河がつなぐ海は？','地中海と紅海','黒海と紅海',0],['世界最大の島（大陸を除く）は？','グリーンランド','ニューギニア島',0],['面積が小さい国は？','モナコ','バチカン市国',1],['ブータンの国旗に描かれるのは？','ライオン','竜',1]]},
{theme:'身近な科学：正しいのはどっち？',qs:[
['氷は水に浮く？','浮く','沈む',0],['音は真空を伝わる？','伝わる','伝わらない',1],['地球に多い大気成分は？','窒素','酸素',0],['雷で先に届くのは？','音','光',1],['水の化学式は？','H₂O','CO₂',0],['虹の外側の色は？','紫','赤',1],['常温で液体の金属は？','水銀','鉄',0],['太陽光が地球に届く時間は？','約8秒','約8分',1],['ドライアイスの主成分は？','二酸化炭素','窒素',0],['純水の密度が最大になる温度は？','約0℃','約4℃',1]]}
];const $=id=>document.getElementById(id);let current=0,questions=[],solved=[],phase='menu',deadline=0,interval=0,epoch=0,pending=false,muted=false,audio,bgm,previous=-1,themeIndex=0,remainingMs=120000;const total=120000;try{muted=localStorage.getItem('asobiroom.dobon.bgm-muted')==='true'}catch{}if(window.AsobiBgm){bgm=new window.AsobiBgm('dobon',()=>audio);bgm.setEnabled(!muted)}
function soundLabel(){$('sound').textContent=muted?'♫ OFF':'♫ ON';$('sound').setAttribute('aria-pressed',String(!muted))}
soundLabel();$('sound').onclick=()=>{muted=!muted;soundLabel();bgm?.setEnabled(!muted);if(!muted&&phase==='play'){initAudio();bgm?.start();bgm?.setUrgent(remainingMs<=30000)}};
function initAudio(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume().catch(()=>{})}catch{}}
function se(ok){if(muted||!audio)return;for(const [f,d] of (ok?[[523,0],[784,.09],[1047,.18]]:[[155,0],[110,.13]])){const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+d;o.type=ok?'sine':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.09,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.17)}}
function setStatus(s,cls=''){$('status').textContent=s;$('status').className='status '+cls}
function loadSet(i){themeIndex=i;questions=sets[i].qs.map(([q,a,b,key])=>Math.random()<.5?[q,a,b,key]:[q,b,a,1-key]);solved=Array(10).fill(false);current=0;pending=false;render()}
function render(){const [q,a,b]=questions[current];$('theme').textContent=sets[themeIndex].theme;$('num').textContent=current+1;$('question').textContent=q;$('a').textContent=a;$('b').textContent=b;$('remaining').textContent=solved.filter(x=>!x).length;for(const id of ['oa','ob'])$(id).className='option';for(const id of ['answerA','answerB']){$(id).className='answer';$(id).disabled=phase!=='play'||pending||solved[current]}if(solved[current])$(questions[current][3]===0?'oa':'ob').classList.add('good');renderNav()}
function renderNav(flash=-1){$('nav').replaceChildren(...solved.map((done,i)=>{const b=document.createElement('button');b.className='tile'+(done?' clear':i===current?' selected':'')+(i===current&&done?' review':'')+(i===flash?' flash':'');b.setAttribute('aria-label','第'+(i+1)+'問'+(done?' クリア済み':''));b.setAttribute('aria-current',i===current?'true':'false');b.innerHTML=done?'<span class="clear-label">クリア</span>':'<span class="circle">'+(i+1)+'</span>';b.disabled=phase==='end';b.onclick=()=>{if(phase!=='play')return;current=i;pending=false;render();setStatus(done?'クリア済み':'問題を選んでA・Bで回答！')};return b}))}
function clock(){remainingMs=Math.max(0,deadline-performance.now());$('time').textContent=Math.ceil(remainingMs/1000);$('shade').style.width=(100*(1-remainingMs/total))+'%';$('timer').classList.toggle('urgent',remainingMs<=30000);bgm?.setUrgent(remainingMs<=30000)}
function tick(){if(phase!=='play')return;clock();if(remainingMs<=0)finish(false)}
function start(i){epoch++;clearInterval(interval);bgm?.stop();if(i===-1)i=(previous+1+Math.floor(Math.random()*(sets.length-1)))%sets.length;previous=i;phase='play';loadSet(i);$('overlay').hidden=true;remainingMs=total;deadline=performance.now()+total;initAudio();bgm?.setUrgent(false);bgm?.start();clock();interval=setInterval(tick,80);setStatus('問題番号は自由に切り替えられます。')}
function answer(value){if(phase!=='play'||pending||solved[current])return;clock();if(remainingMs<=0){finish(false);return}const i=current,token=epoch,ok=value===questions[i][3];pending=true;for(const id of ['answerA','answerB'])$(id).disabled=true;const opt=value===0?'oa':'ob',btn=value===0?'answerA':'answerB';$(opt).classList.add(ok?'good':'bad');$(btn).classList.add(ok?'good':'bad');se(ok);if(ok){solved[i]=true;$('remaining').textContent=solved.filter(x=>!x).length;renderNav(i);setStatus('クリア！','ok');if(solved.every(Boolean)){finish(true);return}setTimeout(()=>{if(epoch!==token||phase!=='play'||current!==i||!pending)return;pending=false;for(let step=1;step<=10;step++){const n=(i+step)%10;if(!solved[n]){current=n;break}}render();setStatus('次の問題へ！')},650)}else{setStatus('不正解！ 別の問題にも移動できます。','no');setTimeout(()=>{if(epoch!==token||phase!=='play'||current!==i||!pending)return;pending=false;render()},650)}}
function finish(ok){phase='end';epoch++;pending=false;clearInterval(interval);bgm?.stop();render();const n=solved.filter(Boolean).length;$('dialog').innerHTML='<h1 class="result-title">'+(ok?'ALL CLEAR!':'TIME UP!')+'</h1><p><b>'+n+' / 10 問クリア</b><br>残り '+Math.ceil(remainingMs/1000)+' 秒</p><button class="action" id="again">別のテーマで挑戦</button> <button class="minor" id="back">タイトルへ</button>';$('overlay').hidden=false;$('again').onclick=()=>start(-1);$('back').onclick=menu}
const menuHtml=$('dialog').innerHTML;function menu(){epoch++;phase='menu';clearInterval(interval);bgm?.stop();$('time').textContent=120;$('shade').style.width='0%';$('timer').classList.remove('urgent');loadSet(0);$('dialog').innerHTML=menuHtml;$('overlay').hidden=false;$('start').onclick=()=>start(Number($('themeSelect').value));setStatus('問題番号は自由に切り替えられます。')}
$('answerA').onclick=()=>answer(0);$('answerB').onclick=()=>answer(1);$('menu').onclick=menu;$('retry').onclick=()=>start(themeIndex);document.addEventListener('keydown',e=>{if(phase!=='play'||e.repeat)return;if(e.key.toLowerCase()==='a')answer(0);else if(e.key.toLowerCase()==='b')answer(1);else if(/^[0-9]$/.test(e.key)){const i=e.key==='0'?9:Number(e.key)-1;$('nav').children[i].click()}});document.addEventListener('visibilitychange',()=>{if(document.hidden)bgm?.stop();else if(phase==='play'){tick();if(phase==='play'&&!muted)bgm?.start()}});window.addEventListener('pagehide',()=>bgm?.stop());menu();
</script></body></html>
