</style></head><body><main><header><b><img src="asobiroom.svg" alt="">asobiroom / 二択ラッシュ <small>TEST</small></b><button id="sound" aria-pressed="true">♫ ON</button></header><div class="screen"><section class="board" aria-label="クイズ"><div class="stage"><div class="left"><div class="theme" id="theme">テーマ</div><div class="question"><span id="num" class="number">1</span><h2 id="question">問題</h2></div><div class="options" id="options" data-format="ab"><div class="option" id="oa"><span class="letter">A</span><span id="readA" class="reading-note" hidden></span><strong id="a">—</strong></div><div class="option" id="ob"><span class="letter">B</span><span id="readB" class="reading-note" hidden></span><strong id="b">—</strong></div></div><div id="explanation" class="explanation" role="status" hidden></div></div><aside class="right"><div class="timerbox" id="timer"><div class="clock" role="timer" aria-label="残り時間"><i>Q</i><div class="meter"><div id="shade"></div></div><span>残り <b id="time">120</b> 秒</span></div></div><div class="remaining">残り <b id="remaining">10</b> 問</div><div class="answerbox" id="answerbox" data-format="ab"><button class="answer" id="answerA" aria-label="Aを選ぶ">A</button><button class="answer" id="answerB" aria-label="Bを選ぶ">B</button></div></aside></div><div class="difficulty"><span>◀ 易しい</span><span>難しい ▶</span></div><nav id="nav" class="nav" aria-label="問題選択"></nav></section><div class="overlay" id="overlay"><div class="dialog" id="dialog"><h1>二択ラッシュ</h1><p>120秒で10問クリア！<br>下の番号を選んで、右側のボタンから回答。<br>難しい問題は後回しでもOK。<br>1問でも間違えるとゲームオーバー。<br><b id="bankCount"></b></p><select id="themeSelect" aria-label="テーマ"><option value="-1">おまかせ</option><option value="-2">ミックス（全ジャンル）</option></select><br><button class="action" id="start">スタート</button></div></div></div><p class="status" id="status" aria-live="polite">問題番号は自由に切り替えられます。</p><div class="controls"><button class="minor" id="menu">タイトルへ</button><button class="minor" id="retry">もう一度</button></div><div class="foot">開発テスト版・記録やランキングは送信されません</div></main><script src="../asobi-bgm.js?v=20261127guides"></script><script src="recorded-bgm.js?v=20261128choice90"></script><script src="questions.js"></script><script>
const sets=window.choiceTenSets,$=id=>document.getElementById(id);
const total=120000, WAIT=960, SHOW=1400, labels={ab:['A','B'],tf:['○','×'],same:['同じ','違う'],meaning:['意味が近い','反対の意味']};
let current=0,questions=[],solved=[],phase='menu',deadline=0,interval=0,epoch=0,muted=false,audio,bgm,previous=-1,themeIndex=0,remainingMs=total,flash=-1;const seen=new Map();
try{muted=localStorage.getItem('asobiroom.dobon.bgm-muted')==='true'}catch{}if(window.DobonRecordedBgm){bgm=new window.DobonRecordedBgm(()=>audio,()=>Math.max(0,deadline-performance.now()),total/1000);bgm.setEnabled(!muted)}else if(window.AsobiBgm){bgm=new window.AsobiBgm('dobon',()=>audio);bgm.setEnabled(!muted)}
function active(){return phase==='play'||phase==='judging'||phase==='feedback'}
function soundLabel(){$('sound').textContent=muted?'♫ OFF':'♫ ON';$('sound').setAttribute('aria-pressed',String(!muted))}
soundLabel();$('sound').onclick=()=>{muted=!muted;soundLabel();bgm?.setEnabled(!muted);if(!muted&&active()){initAudio();bgm?.start();bgm?.setUrgent(remainingMs<=30000)}};
function initAudio(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume().catch(()=>{})}catch{}}
function se(ok){if(muted||!audio)return;const tones=ok?[[784,0,.12],[1047,.12,.26]]:[[138,0,.23],[98,.2,.4]];for(const [freq,delay,duration] of tones){const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+delay;o.type=ok?'sine':'sawtooth';o.frequency.value=freq;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.12,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+duration)}}
function setStatus(s,cls=''){$('status').textContent=s;$('status').className='status '+cls}
function loadSet(i,preview=false){themeIndex=i;const pool=(i===-2?sets.flatMap((s,j)=>s.qs.map((q,k)=>({...q,id:j+':'+k,theme:s.theme}))):sets[i].qs.map((q,k)=>({...q,id:i+':'+k,theme:sets[i].theme})));questions=Array.from({length:10},(_,rank)=>{const candidates=pool.filter(q=>q.difficulty===rank+1);const key=i+':'+rank;let history=seen.get(key)||new Set();let available=candidates.filter(q=>!history.has(q.id));if(!available.length){history=new Set();available=candidates}const item={...available[Math.floor(Math.random()*available.length)]};if(!preview){history.add(item.id);seen.set(key,history)}if(item.format==='ab'&&Math.random()<.5){[item.a,item.b]=[item.b,item.a];item.key=1-item.key}return item});solved=Array(10).fill(false);current=0;flash=-1;render()}
function revealNote(q){const same=q.format==='same';$('readA').hidden=!same||!q.readA;$('readB').hidden=!same||!q.readB;$('readA').textContent=same?q.readA||'':'';$('readB').textContent=same?q.readB||'':'';$('explanation').textContent=same?(q.key===0?'どちらも「'+q.readA+'」と読みます。':'異なる読み方です。'):q.note||'';$('explanation').hidden=!$('explanation').textContent}
function hideNote(){for(const id of ['readA','readB','explanation']){$(id).hidden=true;$(id).textContent=''}}
function render(){hideNote();const q=questions[current],fmt=q.format,ls=labels[fmt];$('theme').textContent=themeIndex===-2?'ミックス ｜ '+q.theme:q.theme;$('num').textContent=current+1;$('question').textContent=fmt==='tf'?'正しい？ 間違い？':q.q;$('a').textContent=fmt==='tf'?q.q:q.a;$('b').textContent=q.b;$('options').dataset.format=fmt;$('answerbox').dataset.format=fmt;$('remaining').textContent=solved.filter(x=>!x).length;for(const [id,value] of [['oa',$('a').textContent],['ob',$('b').textContent]]){$(id).className='option';$(id).classList.toggle('long',value.length>=9)}for(const [j,id] of ['answerA','answerB'].entries()){const b=$(id);b.textContent=ls[j];b.setAttribute('aria-label',ls[j]+'を選ぶ');b.className='answer';b.disabled=phase!=='play'||solved[current]}if(solved[current]){revealNote(q);$(q.key===0?'answerA':'answerB').classList.add('good');if(fmt==='ab')$(q.key===0?'oa':'ob').classList.add('good')}renderNav()}
function renderNav(){ $('nav').replaceChildren(...solved.map((done,i)=>{const b=document.createElement('button');b.className='tile'+(done?' clear':i===current?' selected':'')+(i===flash?' flash':'');b.setAttribute('aria-label','第'+(i+1)+'問'+(done?' クリア済み':''));b.setAttribute('aria-current',i===current&&!done?'true':'false');b.innerHTML=done?'<span class="clear-label">クリア</span>':'<span class="circle">'+(i+1)+'</span>';b.disabled=phase!=='play'||done;b.onclick=()=>{if(phase!=='play'||done)return;current=i;render();setStatus('右側のボタンで回答！')};return b}))}
function clock(){remainingMs=Math.max(0,deadline-performance.now());$('time').textContent=Math.ceil(remainingMs/1000);$('shade').style.width=(100*(1-remainingMs/total))+'%';document.body.classList.toggle('urgent-mode',active()&&remainingMs<=30000);bgm?.setUrgent(remainingMs<=30000)}
function tick(){if(!active())return;clock();if(remainingMs<=0)finish(false)}
function start(i){epoch++;clearInterval(interval);bgm?.stop();if(i===-1){const opts=sets.map((_,j)=>j).filter(j=>j!==previous);i=opts[Math.floor(Math.random()*opts.length)]}previous=i;phase='play';loadSet(i);$('overlay').hidden=true;remainingMs=total;deadline=performance.now()+total;initAudio();bgm?.setUrgent(false);bgm?.start();clock();interval=setInterval(tick,80);setStatus('問題番号は自由に切り替えられます。')}
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function answer(value){if(phase!=='play'||solved[current])return;tick();if(phase!=='play')return;const i=current,token=epoch,q=questions[i],ok=value===q.key;phase='judging';for(const id of ['answerA','answerB'])$(id).disabled=true;renderNav();const btn=value===0?'answerA':'answerB',opt=q.format==='tf'?'oa':q.format==='ab'?(value===0?'oa':'ob'):null;$(btn).classList.add('pending');if(opt)$(opt).classList.add('pending');setStatus('判定中…');await wait(WAIT);if(epoch!==token||phase!=='judging')return;tick();if(phase!=='judging')return;phase='feedback';$(btn).classList.remove('pending');$(btn).classList.add(ok?'good':'bad');if(opt){$(opt).classList.remove('pending');$(opt).classList.add(ok?'good':'bad')}se(ok);if(ok){solved[i]=true;revealNote(q);flash=i;$('remaining').textContent=solved.filter(x=>!x).length;renderNav();setStatus('クリア！','ok');if(solved.every(Boolean)){phase='won';document.body.classList.remove('urgent-mode');clearInterval(interval);bgm?.stop()}}else{setStatus('不正解！ ゲームオーバー','no');finish(false,'wrong');return}await wait(SHOW);if(epoch!==token||!['feedback','won'].includes(phase))return;flash=-1;if(phase==='won'){finish(true);return}tick();if(phase!=='feedback')return;phase='play';render();setStatus('次に挑戦する問題番号を選んでください！','ok')}
function finish(ok,kind=ok?'clear':'timeout'){document.body.classList.remove('urgent-mode');phase='end';epoch++;flash=-1;clearInterval(interval);bgm?.stop();render();const n=solved.filter(Boolean).length;$('dialog').innerHTML='<h1 class="result-title">'+(ok?'ALL CLEAR!':kind==='wrong'?'GAME OVER!':'TIME UP!')+'</h1><p><b>'+n+' / 10 問クリア</b><br>残り '+Math.ceil(remainingMs/1000)+' 秒</p><p id="resultReason"></p><button class="action" id="again">別のテーマで挑戦</button> <button class="minor" id="back">タイトルへ</button>';if(kind==='wrong'){const q=questions[current];$('resultReason').textContent='第'+(current+1)+'問で不正解。正解：'+(q.format==='ab'?[q.a,q.b][q.key]:labels[q.format][q.key])+'　'+(q.note||'')}$('overlay').hidden=false;$('again').onclick=()=>start(-1);$('back').onclick=menu}
const menuHtml=$('dialog').innerHTML;function menu(){document.body.classList.remove('urgent-mode');epoch++;phase='menu';clearInterval(interval);bgm?.stop();$('time').textContent=120;$('shade').style.width='0%';loadSet(0,true);$('dialog').innerHTML=menuHtml;for(const [i,s] of sets.entries()){const o=document.createElement('option');o.value=i;o.textContent=s.theme+'（'+s.qs.length+'問）';$('themeSelect').append(o)}$('bankCount').textContent=sets.length+'テーマ・全'+sets.reduce((n,s)=>n+s.qs.length,0)+'問';$('overlay').hidden=false;$('start').onclick=()=>start(Number($('themeSelect').value));setStatus('問題番号は自由に切り替えられます。')}
$('answerA').onclick=()=>answer(0);$('answerB').onclick=()=>answer(1);$('menu').onclick=menu;$('retry').onclick=()=>start(themeIndex);document.addEventListener('keydown',e=>{if(phase!=='play'||e.repeat)return;if(e.key.toLowerCase()==='a')answer(0);else if(e.key.toLowerCase()==='b')answer(1);else if(/^[0-9]$/.test(e.key)){const i=e.key==='0'?9:Number(e.key)-1;$('nav').children[i].click()}});document.addEventListener('visibilitychange',()=>{if(document.hidden)bgm?.stop();else if(active()){tick();if(active()&&!muted)bgm?.start()}});window.addEventListener('pagehide',()=>bgm?.stop());menu();

function fitText(el,maxWidth,maxHeight,min=9){if(!el||el.hidden||!el.textContent)return;el.style.fontSize='';let size=parseFloat(getComputedStyle(el).fontSize);if(!Number.isFinite(size))return;while(size>min&&(el.scrollWidth>maxWidth+1||el.scrollHeight>maxHeight+1)){size-=1;el.style.fontSize=size+'px'}}
function fitBoard(){
 const q=$('question');q.style.fontSize='';fitText(q,q.clientWidth,Math.max(12,q.parentElement.clientHeight-8));
 for(const [id,rid] of [['a','readA'],['b','readB']]){const t=$(id),rd=$(rid),parent=t.parentElement;if(parent.offsetHeight===0)continue;t.style.fontSize='';rd.style.fontSize='';const st=getComputedStyle(parent);const maxH=parent.clientHeight-parseFloat(st.paddingTop)-parseFloat(st.paddingBottom);const maxW=parent.clientWidth-parseFloat(st.paddingLeft)-parseFloat(st.paddingRight);if(!rd.hidden)fitText(rd,maxW,Math.max(14,maxH*.28));fitText(t,maxW,Math.max(10,maxH-(rd.hidden?0:rd.offsetHeight+4)))}
 const e=$('explanation');if(!e.hidden)fitText(e,e.clientWidth,e.clientHeight,9);

}

window.addEventListener('resize',syncViewport);window.visualViewport?.addEventListener('resize',syncViewport);

syncViewport();
