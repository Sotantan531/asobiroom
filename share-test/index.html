<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>共有機能テスト | asobiroom</title><style>*{box-sizing:border-box}body{margin:0;background:#faf8ef;color:#213930;font:16px system-ui}header,main{max-width:850px;margin:auto;padding:20px}article{background:white;border:1px solid #b8c4ba;border-radius:16px;padding:18px;margin:12px 0}h2{font-size:19px;margin:0}button,select{font:inherit;padding:10px 14px;border:1px solid #213930;border-radius:10px;background:#f6bd48;color:#213930;cursor:pointer}button:focus-visible{outline:3px solid #2783b8} .top{display:flex;justify-content:space-between;align-items:center;gap:12px}small{color:#52645b}dialog{max-width:90vw;border:1px solid;border-radius:16px;padding:24px}input{width:100%;padding:10px;margin:12px 0}a{color:#213930}</style><header><h1>asobiroom / SHARE TEST</h1><p>共有ボタンの動作確認専用。ゲームは起動せず、統計も送信しません。</p></header><main id="list"></main><dialog id="fallback"><h2>ゲームを共有</h2><input id="link" readonly aria-label="共有URL"><button id="copy">URLをコピー</button> <button id="close">閉じる</button><p id="status" role="status"></p></dialog><script>const games=[{"title":"弓道 — 一射の間","desc":"的と矢摺籐で狙い、会で伸び合う。個人・6人団体の3D弓道。","url":"https://asobiroom.net/kyudo.html"},{"title":"隔離区画 02｜呪われた屋敷","desc":"一体の気配が、狭い通路を段階的に迫る。戻る解錠ゲージを満たして脱出せよ。","url":"https://asobiroom.net/sector-02/"},{"title":"深海ゼロダイブ","desc":"答えの数字に、ゼロはいくつ？「＋」「－」でゼロの数を調整して、GO！ 数の大きさを予想しながら深海を目指すクイズゲーム。","url":"https://asobiroom.net/zero-dive/"},{"title":"FLIGHTLINE DARTS","desc":"狙いを定めてダーツを投げよう。クリケットでは、狙うナンバーを選ぶのも勝負のうち。","url":"https://asobiroom.net/darts/"},{"title":"ドボンクイズ","desc":"制限時間は80秒。いろいろなジャンルの問題で、ドボンを避けながら答えを選ぼう。","url":"https://asobiroom.net/dobon-quiz/"},{"title":"隔離区画 01｜石像の庭園","desc":"振り返ると、石像は止まる。夜の庭園で3体の石像を警戒しながら、4つのスイッチを灯して鉄門を目指す一人称ホラー。","url":"https://asobiroom.net/sector-01/"},{"title":"BILLIARDS CLUB","desc":"3Dビリヤードで8ボールと9ボールを遊ぼう。CPUの強さを選ぶ対戦と、友達との2人対戦に対応！","url":"https://asobiroom.net/billiards/"},{"title":"ポケット・ボウリング","desc":"重さを選んで、曲げて投球。オイルで変わる球筋とピンセッターの動きを楽しむ、10フレームのボウリング。","url":"https://asobiroom.net/bowling/"},{"title":"クリスタル・ポップ","desc":"宝石を3つそろえて、きらめく連鎖！3つの難易度、氷やスライムのギミック、ボムのミックスコンボに挑戦しよう。","url":"https://asobiroom.net/crystal-pop/"},{"title":"ホームラン・インパクト","desc":"狙って、離して、かっ飛ばす。10球のホームラン競争。","url":"https://asobiroom.net/homerun-impact.html"},{"title":"早撃ちガンマン","desc":"反射神経と心理戦。6モード＆オンライン決闘。","url":"https://asobiroom.net/gunman.html"}];const list=document.querySelector('#list'),dialog=document.querySelector('#fallback'),link=document.querySelector('#link'),status=document.querySelector('#status');for(const game of games){const card=document.createElement('article'),top=document.createElement('div'),title=document.createElement('h2'),button=document.createElement('button'),desc=document.createElement('p'),url=document.createElement('small');top.className='top';title.textContent=game.title;button.textContent='↗ 共有';button.setAttribute('aria-label',game.title+'を共有');desc.textContent=game.desc;url.textContent=game.url;button.onclick=async()=>{const data={title:game.title+' | asobiroom',text:game.title+'で遊ぼう！',url:game.url};if(navigator.share){try{await navigator.share(data);return}catch(e){if(e.name==='AbortError')return}}link.value=game.url;status.textContent='';dialog.showModal()};top.append(title,button);card.append(top,desc,url);list.append(card)}document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(link.value);status.textContent='URLをコピーしました'}catch(e){link.select();status.textContent='選択したURLを手動でコピーしてください'}};document.querySelector('#close').onclick=()=>dialog.close();</script></html>
